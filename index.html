<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immo-Gest – gestion immobilière</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Immo-Gest">
<meta name="theme-color" content="#10243F">
<style>
:root{--bg:#f3f5f2;--sf:#fff;--tx:#1d2a26;--mu:#6a7873;--bd:#d9dfdb;--ac:#1f5c4d;--ac2:#e9f1ee;--rd:#b3402f;--am:#a8741a;font-family:"Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141a18;--sf:#1c2421;--tx:#e6ece9;--mu:#8fa099;--bd:#2f3b37;--ac:#5fb59f;--ac2:#23322d;--rd:#e07a69;--am:#d9a441;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--mu);font:inherit;cursor:pointer}
nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
button{font:inherit}.btn{background:var(--ac);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.sec{background:var(--ac2);color:var(--ac)}.btn.del{background:none;color:var(--rd);padding:4px 8px}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.bar h2{margin:0;font-size:20px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}tr:last-child td{border:0}tbody tr{cursor:pointer}tbody tr:hover{background:var(--ac2)}
.empty{padding:28px;text-align:center;color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kp div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px}
.kp b{display:block;font-size:26px;margin-top:2px}.kp span{color:var(--mu);font-size:13px}
.tag{padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:12px}
.tag.r{background:#b3402f22;color:var(--rd)}.tag.a{background:#a8741a22;color:var(--am)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:min(460px,94vw);padding:18px}
dialog::backdrop{background:#0008}dialog{max-height:92vh;overflow:auto}h3{margin:18px 0 8px;font-size:16px}.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.fb input,.fb select{width:auto;flex:1;min-width:130px}#prt{display:none}
@media print{body>*{display:none!important}body>#prt{display:block!important;color:#000;background:#fff;padding:20mm;font-size:14pt;line-height:1.5}}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{flex-wrap:wrap;display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
#st{font-size:13px;color:var(--mu)}
.note{font-size:13px;color:var(--mu);margin:8px 0 0;line-height:1.4}

:root{--bg:#f5f1e6;--sf:#fff;--tx:#14213a;--mu:#6b7280;--bd:#e2d9c3;--ac:#10243F;--ac2:#f1e9d3;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1524;--sf:#152036;--tx:#e8edf6;--mu:#9aa6bd;--bd:#27385a;--ac:#C9A45C;--ac2:#1f2d48;--on:#10243F}}
header{background:linear-gradient(160deg,#17325a,#0b1a30);border-bottom:3px solid #C9A45C}
header h1{color:#f6e2ab;font-weight:800;letter-spacing:.2px}.lg{height:44px;width:auto}
nav button{color:#b9c3d6}nav button.on{background:rgba(201,164,92,.22);color:#f6e2ab}
#st{color:#b9c3d6}header .btn.sec{background:transparent;color:#f6e2ab;border:1px solid #C9A45C}
.btn{color:var(--on)}
.mr{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.mr:last-child{border:0}
#dd td,#dd th,#prt td,#prt th{white-space:normal;border-bottom:0}#dd table,#prt table{table-layout:fixed}
.dashboard{display:grid;gap:20px}.dash-welcome{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:4px}.dash-welcome h2{font-size:clamp(24px,3vw,32px);letter-spacing:-.04em;margin:0 0 6px}.dash-welcome p,.dash-date{color:var(--mu);margin:0}.dash-date{font-size:14px}
.dash-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.dash-stat,.dash-panel{background:var(--sf);border:1px solid var(--bd);border-radius:12px}.dash-stat{padding:15px;min-height:110px}.dash-stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--mu);font-size:13px}.dash-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:var(--ac2);color:var(--ac);font-size:17px}.dash-stat-value{font-size:26px;font-weight:750;margin-top:12px}.dash-stat-unit{font-size:12px;font-weight:500;color:var(--mu)}
.dash-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.8fr);gap:16px;align-items:start}.dash-section{margin-bottom:16px}.dash-section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 9px}.dash-section-title h3{margin:0;font-size:17px}.dash-count{font-size:12px;color:var(--mu);background:var(--ac2);border-radius:99px;padding:4px 9px}.dash-panel{padding:14px}.dash-table{table-layout:auto}.dash-table td{white-space:normal}.dash-empty{min-height:86px;display:flex;align-items:center;gap:12px;color:var(--mu)}.dash-empty-icon{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ac2);color:var(--ac);font-size:18px}.dash-empty strong{display:block;color:var(--tx);margin-bottom:3px}.dash-empty span{font-size:13px}
.dash-mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.dash-mini:last-child{border:0}.dash-mini strong{display:block}.dash-mini span{font-size:12px;color:var(--mu)}.dash-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dash-shortcuts button{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:11px;text-align:left;color:var(--tx);cursor:pointer;font-weight:600}.dash-shortcuts button:hover{border-color:var(--am);background:var(--ac2)}.dash-actions{display:flex;gap:6px;flex-wrap:wrap}.dash-action{white-space:nowrap;padding:6px 9px;font-size:12px}.dash-tip{line-height:1.5;color:var(--mu);font-size:13px}
.taxonomy-control{display:grid;grid-template-columns:1fr;gap:6px}.taxonomy-add,.taxonomy-remove{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.taxonomy-add input{flex:1;min-width:0}.taxonomy-add button{flex:none}.taxonomy-add button:disabled,.taxonomy-remove button:disabled{opacity:.5;cursor:not-allowed}.taxonomy-remove .note{margin:0}
#langSel{width:auto;min-width:118px}
html[dir="rtl"] body{direction:rtl}
html[dir="rtl"] th,html[dir="rtl"] td{text-align:right}
html[dir="rtl"] .dash-shortcuts button{text-align:right}
html[dir="rtl"] #dd table th,html[dir="rtl"] #dd table td{text-align:right!important}
@media(max-width:850px){.dash-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.dash-layout{grid-template-columns:1fr}}
@media(max-width:560px){.dash-welcome{align-items:flex-start;flex-direction:column}.dash-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.dash-stat{padding:12px;min-height:100px}.dash-stat-value{font-size:23px}.dash-shortcuts{grid-template-columns:1fr 1fr}}
</style>
</head>

/* ---- Fichiers (stockés dans le dépôt de données) ---- */
const api2=p=>`https://api.github.com/repos/${C.repo}/contents/${p}`;
const ghGet=(p,raw)=>fetch(api2(p),{headers:raw?{...hd(),Accept:'application/vnd.github.raw'}:hd()});
const toB64=buf=>{let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)};
const shrink=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>res(b||f),'image/jpeg',.8)};i.onerror=()=>res(f);i.src=URL.createObjectURL(f)});
async function upFile(r,f){if(!C.token||!C.repo){alert('Configurez d\'abord la Synchronisation.');return}
let b=f;if(f.type.startsWith('image/'))b=await shrink(f);
if(b.size>25e6){alert('Fichier trop lourd (max 25 Mo) : '+f.name+'. Compressez la vidéo ou gardez un lien dans les notes.');return}
const nm=f.name.replace(/[^\w.\-]+/g,'_'),p=`fichiers/${r.id}/${Date.now()}-${nm}`;status('Envoi de '+f.name+'…');
try{const res=await fetch(api2(p),{method:'PUT',headers:hd(),body:JSON.stringify({message:'Fichier '+nm,content:toB64(await b.arrayBuffer())})});
if(!res.ok){status('Erreur fichier : '+res.status);return}
(r.files=r.files||[]).push({n:f.name,p,t:b.type||f.type||''});save();status('Fichier ajouté')}catch(e){status('Erreur : '+e.message)}}
async function delFile(r,f){try{const m=await ghGet(f.p);if(m.ok){const j=await m.json();await fetch(api2(f.p),{method:'DELETE',headers:hd(),body:JSON.stringify({message:'Suppression',sha:j.sha})})}r.files=r.files.filter(x=>x!==f);save()}catch(e){status('Erreur : '+e.message)}}
async function openF(f){status('Chargement…');const r=await ghGet(f.p,1);if(!r.ok){status('Erreur '+r.status);return}
const t=f.t||'',u=URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:t||'application/octet-stream'}));status('');
$('#vb').innerHTML=t.startsWith('image/')?`<img src="${u}" style="max-width:100%">`:t.startsWith('video/')?`<video src="${u}" controls playsinline style="max-width:100%"></video>`:t==='application/pdf'?`<iframe src="${u}" style="width:100%;height:60vh;border:0"></iframe>`:`<p>${userText(f.n)}</p>`;
$('#vd').href=u;$('#vd').download=f.n;$('#dV').showModal()}
function renderFiles(r){const el=$('#fl'),fs=r.files||[];
el.innerHTML=fs.length?fs.map((f,i)=>`<div style="display:flex;gap:6px;align-items:center;margin:4px 0"><button type="button" class="btn sec" style="flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis" data-o="${i}">${(f.t||'').startsWith('image/')?'🖼':(f.t||'').startsWith('video/')?'🎬':'📄'} ${userText(f.n)}</button><button type="button" class="btn del" data-x="${i}">✕</button></div>`).join(''):'<p class="note">Aucun fichier.</p>';
el.onclick=async ev=>{const o=ev.target.closest('[data-o]'),x=ev.target.closest('[data-x]');if(o)openF(fs[o.dataset.o]);if(x&&confirm('Supprimer ce fichier ?')){await delFile(r,fs[x.dataset.x]);renderFiles(r)}}}
$('#vx').onclick=()=>$('#dV').close();

/* ---- Recherche et filtres ---- */
let F={q:'',a:'',b:'',p:''};
const FA={biens:'statut',clients:'role',visites:'statut',loyers:'statut',offres:'statut',relances:'statut',factures:'statut',annonces:'statut'};
function lab(o,id){const x=D[o].find(y=>y.id===id);return x?E[o].lab(x):''}
function filt(){const e=E[tab],q=F.q.toLowerCase();return D[tab].filter(r=>{if(F.a&&r[FA[tab]]!==F.a)return false;if(F.b&&r.trans!==F.b)return false;if(F.p&&Number(r.prix||0)>Number(F.p))return false;
return !q||e.f.some(([k,,t,o])=>String(t==='ref'?lab(o,r[k]):r[k]??'').toLowerCase().includes(q))})}
function list(){const e=E[tab],rows=filt();$('#cnt').textContent=rows.length+' / '+D[tab].length;
$('#tl').innerHTML=rows.length?`<table><thead><tr>${e.c.map(k=>`<th>${e.f.find(f=>f[0]===k)[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr data-id="${r.id}">${e.c.map(k=>`<td>${show(k,e,r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`:`<div class="empty">${D[tab].length?'Aucun résultat.':`Aucun ${e.s} pour l'instant. Ajoutez le premier.`}</div>`}
function render(){nav();const m=$('#main');if(tab==='dash'){dash(m);return}if(tab==='stats'){stats(m);return}
const e=E[tab],fa=e.f.find(f=>f[0]===FA[tab]),addLabel=tab==='annonces'?'Ajouter une annonce':`Ajouter un ${e.s}`;
m.innerHTML=`<div class="bar"><h2>${e.l} <span id="cnt" class="note"></span></h2><button class="btn" id="add">${addLabel}</button></div>
<div class="fb"><input id="fq" type="search" placeholder="Rechercher…" value="${esc(F.q)}"><select id="fa"><option value="">${tr(fa[1])} : ${tr('tous')}</option>${fa[3].map(x=>`<option ${F.a===x?'selected':''}>${x}</option>`).join('')}</select>${tab==='biens'?`<select id="fb"><option value="">Vente et location</option><option ${F.b==='Vente'?'selected':''}>Vente</option><option ${F.b==='Location'?'selected':''}>Location</option></select><input id="fp" type="number" placeholder="Prix max" value="${esc(F.p)}">`:''}</div><div class="tw" id="tl"></div>`;
$('#add').onclick=()=>edit();$('#fq').oninput=ev=>{F.q=ev.target.value;list()};$('#fa').onchange=ev=>{F.a=ev.target.value;list()};
if(tab==='biens'){$('#fb').onchange=ev=>{F.b=ev.target.value;list()};$('#fp').oninput=ev=>{F.p=ev.target.value;list()}}
list()}

function quittance(r){if(r.statut!=='Payé'&&!confirm(`Ce loyer n'est pas marqué « Payé ». Générer quand même la quittance ?`))return;
const b=D.biens.find(x=>x.id===r.bien)||{},t=D.clients.find(x=>x.id===r.loc)||{},p=D.clients.find(x=>x.id===b.proprio)||{},P=JSON.parse(localStorage.getItem('agence_prof')||'{}');
const [y,mo]=(r.mois||'').split('-'),mois=y?new Intl.DateTimeFormat(intlLocale(),{month:'long',year:'numeric'}).format(new Date(+y,+mo-1,1)):'';
$('#qn').value=P.nom||(D.profil||{}).nom||'';$('#qc').value=P.ville||(D.profil||{}).ville||'';
const draw=()=>{localStorage.setItem('agence_prof',JSON.stringify({...JSON.parse(localStorage.getItem('agence_prof')||'{}'),nom:$('#qn').value,ville:$('#qc').value}));
$('#qp').innerHTML=`<h2 style="text-align:center;margin:0 0 4px">QUITTANCE DE LOYER</h2><p style="text-align:center;margin:0 0 18px">Mois de ${esc(mois)}</p>
<p>${tr('Je soussigné(e)')} <b>${userText($('#qn').value||'…………')}</b>, ${tr('agissant pour le compte du bailleur')} <b>${userText(p.nom||'…………')}</b>, ${tr('reconnais avoir reçu de')} <b>${userText(t.nom||'…………')}</b> ${tr('la somme de')} <b>${fmt(r.montant)} MAD</b> ${tr('au titre du loyer du mois de')} ${esc(mois)}, ${tr('pour le logement situé :')} <b>${userText(b.adr||b.titre||'…………')}</b>.</p>
<p>Pour valoir quittance.</p><p style="margin-top:24px">${tr('Fait à')} ${userText($('#qc').value||'…………')}, ${tr('le')} ${new Date().toLocaleDateString(intlLocale())}</p><p style="margin-top:50px">Signature :</p>`};
$('#qn').oninput=draw;$('#qc').oninput=draw;draw();
$('#qx').onclick=()=>$('#dQ').close();$('#qpr').onclick=()=>{$('#prt').innerHTML=$('#qp').innerHTML;window.print()};
$('#dQ').showModal()}

const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function score(c,b){if(c.role!=='Acquéreur'&&c.role!=='Locataire')return null;if(b.statut&&b.statut!=='Disponible')return null;if((c.role==='Acquéreur')!==(b.trans==='Vente'))return null;
let tot=0,ok=0;const notes=[];
if(c.type_rech&&c.type_rech!=='Indifférent'){tot++;if(c.type_rech!==b.type)return null;ok++}
if(c.sous_type_rech&&c.sous_type_rech!=='Indifférent'){tot++;if(c.sous_type_rech!==b.sous_type)return null;ok++}
const bud=Number(c.budget||0),pr=Number(b.prix||0);if(bud&&pr){tot++;if(pr>bud*1.1)return null;if(pr>bud)notes.push('Un peu au-dessus du budget');else ok++}
const sm=Number(c.surfmin||0),sf=Number(b.surf||0);if(sm&&sf){tot++;if(sf<sm)return null;ok++}
const zs=nz(c.zone).split(/[,;\/]+/).map(x=>x.trim()).filter(Boolean);if(zs.length&&b.adr){tot++;if(zs.some(z=>nz(b.adr).includes(z)))ok++;else notes.push('Zone à vérifier')}
return {s:tot?Math.round(ok/tot*100):50,notes,tot}}
const matchClients=b=>D.clients.map(c=>({it:c,...(score(c,b)||{s:-1})})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s);
const matchBiens=c=>D.biens.map(b=>({it:b,...(score(c,b)||{s:-1})})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s);
function waMatch(c,b){const v=b.trans==='Vente',kind=[b.type,b.sous_type].filter(Boolean).map(tr).join(' — ')||tr('Bien');return `${tr('Bonjour')} ${c.nom},\n\n${tr("J'ai un bien qui pourrait vous intéresser :")} ${kind} ${v?tr('à vendre'):tr('à louer')}${b.titre?' — '+b.titre:''}${b.adr?'\n📍 '+b.adr:''}${b.surf?'\n📐 '+b.surf+' m²':''}${b.prix?'\n💰 '+fmt(b.prix)+' MAD'+(v?'':' / '+tr('mois')):''}\n\n${tr('Souhaitez-vous le visiter ?')}\n\n${sign()}`}
function matchesFor(kind,o){const L=kind==='b'?matchClients(o):matchBiens(o);
$('#mt').textContent=kind==='b'?`Acquéreurs pour « ${o.titre||'ce bien'} »`:`Biens pour ${o.nom||'ce client'}`;
$('#mb').innerHTML=L.length?L.map(x=>{const it=x.it,l=kind==='b'?`<b>${userText(it.nom)}</b><div class="note">${[it.budget?esc(tr('Budget'))+' '+fmt(it.budget)+' MAD':'',it.zone?userText(it.zone):'',it.type_rech&&it.type_rech!=='Indifférent'?esc(tr(it.type_rech)):'',it.sous_type_rech&&it.sous_type_rech!=='Indifférent'?userText(it.sous_type_rech):''].filter(Boolean).join(' • ')}</div>`:`<b>${userText(it.titre)}</b><div class="note">${[it.type?esc(tr(it.type)):'',it.sous_type?userText(it.sous_type):'',it.prix?fmt(it.prix)+' MAD':'',it.surf?it.surf+' m²':'',it.adr?userText(it.adr):''].filter(Boolean).join(' • ')}</div>`;
return `<div class="mr"><div style="flex:1;min-width:0">${l}${x.notes.length?`<div class="note" style="color:var(--am)">${esc(x.notes.map(tr).join(' • '))}</div>`:''}</div><span class="tag">${x.s} %</span><button class="btn sec" data-c="${kind==='b'?it.id:o.id}" data-b="${kind==='b'?o.id:it.id}">WhatsApp</button></div>`}).join(''):`<div class="empty">Aucune correspondance pour l'instant. Complétez le budget, le type et la zone dans les fiches clients.</div>`;
$('#mb').onclick=ev=>{const bt=ev.target.closest('[data-c]');if(!bt)return;const c=D.clients.find(x=>x.id===bt.dataset.c),b=D.biens.find(x=>x.id===bt.dataset.b);if(c&&b)wa(c.tel,waMatch(c,b))};
$('#mx').onclick=()=>$('#dM').close();$('#dM').showModal()}
function corrHtml(){const rows=D.biens.filter(b=>b.statut==='Disponible').map(b=>({b,n:matchClients(b).filter(x=>x.s>=60&&x.tot>0).length})).filter(x=>x.n>0);
return `<h3>Acquéreurs à appeler</h3>`+(rows.length?`<div class="tw"><table><tbody>${rows.map(x=>`<tr><td>${esc(x.b.titre)}</td><td>${x.n} client${x.n>1?'s':''} correspondant${x.n>1?'s':''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="tw"><div class="empty">Aucune correspondance pour l'instant.</div></div>`)}

function nextNum(){const y=new Date().getFullYear();let mx=0;D.factures.forEach(f=>{const m=String(f.num||'').match(new RegExp('^F-'+y+'-(\\d+)$'));if(m)mx=Math.max(mx,+m[1])});return `F-${y}-${String(mx+1).padStart(3,'0')}`}
function lettres(n){n=Math.round(n);if(!n)return 'zéro';const u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'],d=['','','vingt','trente','quarante','cinquante','soixante'];
const c99=x=>{if(x<20)return u[x];if(x<70){const t=Math.floor(x/10),r=x%10;return d[t]+(r===1?' et un':r?'-'+u[r]:'')}if(x<80){const r=x-60;return 'soixante'+(r===11?' et onze':'-'+u[r])}const r=x-80;return 'quatre-vingt'+(r===0?'s':'-'+u[r])};
const c=x=>{if(x<100)return c99(x);const h=Math.floor(x/100),r=x%100;return (h===1?'cent':u[h]+' cent'+(r===0?'s':''))+(r?' '+c99(r):'')};
const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1e3),r=n%1e3,p=[];
if(m)p.push(m===1?'un million':c(m)+' millions');if(k)p.push(k===1?'mille':c(k).replace(/(cent|vingt)s$/,'$1')+' mille');if(r)p.push(c(r));return p.join(' ')}
function englishNumberWords(value){const n=Math.round(value),ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];function part(x){const out=[];if(x>=100){out.push(ones[Math.floor(x/100)],'hundred');x%=100}if(x>=20){out.push(tens[Math.floor(x/10)]);if(x%10)out[out.length-1]+='-'+ones[x%10]}else if(x)out.push(ones[x]);return out.join(' ')}if(!n)return ones[0];value=n;const out=[];for(const [size,label] of [[1e9,'billion'],[1e6,'million'],[1e3,'thousand'],[1,'']]){const count=Math.floor(value/size);if(count){out.push(part(count)+(label?' '+label:''));value%=size}}return out.join(' ')}

/* ---- Synchronisation GitHub ---- */
const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const api=()=>`https://api.github.com/repos/${C.repo}/contents/${C.path||'data.json'}`;
const hd=()=>({Authorization:'Bearer '+C.token,Accept:'application/vnd.github+json'});
const syncKey='agence_sync_state';
const syncBackupKey='agence_sync_backup';
let syncBusy=false,syncAgain=false,pendingConflict=null,dismissedConflict='';
const syncTarget=()=>`${C.repo.toLowerCase()}/${C.path||'data.json'}`;
const snapshot=()=>JSON.stringify(D);
function syncState(){try{const s=JSON.parse(localStorage.getItem(syncKey)||'null');return s&&s.target===syncTarget()?s:null}catch{return null}}
function setSyncState(data,sha){localStorage.setItem(syncKey,JSON.stringify({target:syncTarget(),data,sha}))}
function saveSyncBackup(data,source){localStorage.setItem(syncBackupKey,JSON.stringify({target:syncTarget(),data:typeof data==='string'?data:JSON.stringify(data),source,createdAt:new Date().toISOString()}))}
function getSyncBackup(){try{const b=JSON.parse(localStorage.getItem(syncBackupKey)||'null');return b&&typeof b.data==='string'?b:null}catch{return null}}
async function getRemote(){const r=await fetch(api(),{headers:hd()});if(r.status===404)return null;if(!r.ok)throw new Error('GitHub '+r.status);return r.json()}
function readRemote(rm){if(!rm.content)throw new Error('Le fichier distant ne peut pas être lu par l’API GitHub.');const data=JSON.parse(unb64(rm.content));if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('Le fichier distant ne contient pas de données Immo-Gest valides.');return data}
function normalizeSnapshot(data){const current=D;D=data;norm();const result={data:D,snapshot:snapshot()};D=current;return result}
async function putRemote(data,sha){const body={message:'Synchronisation Immo-Gest '+new Date().toISOString(),content:b64(JSON.stringify(JSON.parse(data),null,1))};if(sha)body.sha=sha;const r=await fetch(api(),{method:'PUT',headers:hd(),body:JSON.stringify(body)});if(!r.ok){const error=new Error('GitHub '+r.status+' — la version distante a peut-être changé; relancez la synchronisation.');error.status=r.status;throw error}const result=await r.json();if(!result.content?.sha)throw new Error('GitHub n’a pas confirmé la sauvegarde.');return result.content.sha}
function downloadBackup(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function showConflict(remote,sha,reason){const local=snapshot(),key=`${sha||'absent'}:${local}`;if(key===dismissedConflict){status('Conflit en attente de votre choix');return}pendingConflict={remote,sha,local,key};const hasRemote=Boolean(remote);$('#conflictBody').innerHTML=`<h2 style="margin:0">Données différentes détectées</h2><p class="note">${esc(tr(reason))}</p><p>${hasRemote?'Pour éviter toute perte, choisissez quelle version conserver. L’autre version sera conservée sur cet appareil et pourra être téléchargée depuis Synchronisation.':'Vos données locales sont conservées. Vous pouvez recréer le fichier distant ou réessayer plus tard.'}</p><div class="row">${hasRemote?'<button class="btn sec" id="keepRemote">Utiliser la version GitHub</button>':''}<button class="btn" id="keepLocal">${hasRemote?'Utiliser cet appareil':'Recréer le fichier GitHub depuis cet appareil'}</button><button class="btn sec" id="closeConflict">Plus tard</button></div>`;$('#keepRemote')?.addEventListener('click',()=>chooseRemote());$('#keepLocal').onclick=()=>chooseLocal();$('#closeConflict').onclick=()=>{dismissedConflict=key;pendingConflict=null;$('#dConflict').close()};if(!$('#dConflict').open)$('#dConflict').showModal();status('Conflit détecté : choisissez la version à conserver')}
function applyRemote(data,sha){const normalized=normalizeSnapshot(data);D=normalized.data;localStorage.setItem('agence_data',normalized.snapshot);setSyncState(normalized.snapshot,sha);localStorage.removeItem('agence_pending');render()}
async function chooseRemote(){if(!pendingConflict?.remote)return;const conflict=pendingConflict;try{const latest=await getRemote();if(!latest){showConflict(null,null,'Le fichier distant a disparu pendant votre choix.');return}if(latest.sha!==conflict.sha||snapshot()!==conflict.local){showConflict(readRemote(latest),latest.sha,'La version a changé pendant votre choix. Vérifiez les versions avant de continuer.');return}saveSyncBackup(conflict.local,'appareil');applyRemote(conflict.remote,conflict.sha);pendingConflict=null;dismissedConflict='';$('#dConflict').close();status('Version GitHub récupérée; copie locale conservée sur cet appareil')}catch(e){status('Impossible de récupérer GitHub sans risque : '+e.message)}}
async function chooseLocal(){if(!pendingConflict)return;const conflict=pendingConflict;try{if(conflict.remote)saveSyncBackup(conflict.remote,'GitHub');const sha=await putRemote(conflict.local,conflict.sha);setSyncState(conflict.local,sha);localStorage.removeItem('agence_pending');pendingConflict=null;dismissedConflict='';$('#dConflict').close();status(conflict.remote?'Version de cet appareil envoyée; copie GitHub conservée sur cet appareil':'Fichier de synchronisation recréé');if(snapshot()!==conflict.local){localStorage.setItem('agence_pending','1');timer=setTimeout(syncNow,250)}}catch(e){status('Erreur de synchronisation : '+e.message);if(e.status===409||e.status===422){pendingConflict=null;dismissedConflict='';$('#dConflict').close();syncNow()}}}
async function syncNow(){if(!C.token||!C.repo)return;if(document.querySelector('dialog[open]'))return;if(!navigator.onLine){localStorage.setItem('agence_pending','1');status('Hors connexion : vos données restent sur cet appareil');return}if(syncBusy){syncAgain=true;return}syncBusy=true;const local=snapshot();try{status('Vérification de la synchronisation…');const state=syncState(),rm=await getRemote();if(snapshot()!==local||document.querySelector('dialog[open]')){syncAgain=true;return}
if(!rm){if(state?.sha){showConflict(null,null,'Le fichier de synchronisation a disparu de GitHub. Vos données locales sont conservées.');return}const sha=await putRemote(local);setSyncState(local,sha);localStorage.removeItem('agence_pending');status('Sauvegarde créée sur GitHub');return}
const remote=readRemote(rm),normalized=normalizeSnapshot(remote);
if(!state){if(local===normalized.snapshot){applyRemote(remote,rm.sha);status('Synchronisé');return}showConflict(remote,rm.sha,'Cet appareil n’a pas encore de version de référence commune avec GitHub.');return}
if(rm.sha===state.sha){if(local===state.data){localStorage.removeItem('agence_pending');status('Synchronisé '+new Date().toLocaleTimeString(intlLocale()));return}const sha=await putRemote(local,rm.sha);setSyncState(local,sha);localStorage.removeItem('agence_pending');status('Sauvegardé sur GitHub '+new Date().toLocaleTimeString(intlLocale()));if(snapshot()!==local)syncAgain=true;return}
if(local===state.data){applyRemote(remote,rm.sha);status('Nouvelles données récupérées depuis GitHub');return}
showConflict(remote,rm.sha,'Les données ont changé sur cet appareil et sur GitHub depuis la dernière synchronisation.');
}catch(e){localStorage.setItem('agence_pending','1');status('Erreur de synchronisation : '+e.message)}finally{syncBusy=false;if(syncAgain){syncAgain=false;clearTimeout(timer);timer=setTimeout(syncNow,250)}}}
$('#bSync').onclick=()=>{$('#syncBody').innerHTML=`<h2 style="margin:0">Synchronisation GitHub</h2>
<label>Dépôt (utilisateur/nom)</label><input id="sr" value="${esc(C.repo||'')}" placeholder="monnom/agence-donnees">
<label>Fichier</label><input id="sp" value="${esc(C.path||'data.json')}">
<label>Jeton d'accès personnel</label><input id="sk" type="password" value="${esc(C.token||'')}">
<p class="note">Utilisez un dépôt privé et un jeton fin (fine-grained) limité à ce dépôt, avec la permission « Contents : lecture et écriture ». Le jeton reste dans ce navigateur uniquement; configurez-le sur chacun de vos appareils. Les modifications sont envoyées automatiquement; les nouvelles données sont vérifiées à l’ouverture, au retour en ligne et chaque minute.</p>
<div class="row" style="flex-wrap:wrap"><button class="btn sec" id="pe">Mon entreprise</button><button class="btn sec" id="ex">Exporter JSON</button>${getSyncBackup()?'<button class="btn sec" id="eb">Télécharger la copie de sécurité</button>':''}<button class="btn sec" id="im">Importer JSON</button><button class="btn sec" id="pl">Vérifier / récupérer</button><button class="btn" id="ps">Enregistrer et synchroniser</button></div><input type="file" id="fi" accept=".json" hidden>`;
$('#dSync').showModal();
const cfg=()=>{C={repo:$('#sr').value.trim(),path:$('#sp').value.trim()||'data.json',token:$('#sk').value.trim()};localStorage.setItem('agence_cfg',JSON.stringify(C))};
$('#ps').onclick=()=>{cfg();$('#dSync').close();syncNow()};$('#pl').onclick=()=>{cfg();$('#dSync').close();syncNow()};
$('#pe').onclick=()=>{$('#dSync').close();profilDialog()};$('#ex').onclick=()=>downloadBackup('agence-sauvegarde.json',D);
$('#eb')?.addEventListener('click',()=>{const backup=getSyncBackup();if(backup)downloadBackup('immo-gest-sauvegarde-'+backup.source+'.json',JSON.parse(backup.data))});
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=async ev=>{try{D=JSON.parse(await ev.target.files[0].text());norm();save();render();$('#dSync').close()}catch(e){alert('Fichier invalide')}}};
$('#dSync').addEventListener('click',ev=>{if(ev.target.id==='dSync')ev.target.close()});
$('#dConflict').addEventListener('close',()=>{if(pendingConflict){dismissedConflict=pendingConflict.key;pendingConflict=null}});
$('#langSel').onchange=ev=>setLanguage(ev.target.value);setLanguage(lang);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('online',()=>syncNow());
addEventListener('offline',()=>{if(C.token&&C.repo){localStorage.setItem('agence_pending','1');status('Hors connexion : vos données restent sur cet appareil')}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
if(C.token&&C.repo){if(localStorage.getItem('agence_pending'))status('Synchronisation en attente…');setTimeout(syncNow,400);setInterval(syncNow,60000)}
</script>
