<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agence – gestion immobilière</title>
<style>
:root{--bg:#f3f5f2;--sf:#fff;--tx:#1d2a26;--mu:#6a7873;--bd:#d9dfdb;--ac:#1f5c4d;--ac2:#e9f1ee;--rd:#b3402f;--am:#a8741a;font-family:"Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141a18;--sf:#1c2421;--tx:#e6ece9;--mu:#8fa099;--bd:#2f3b37;--ac:#5fb59f;--ac2:#23322d;--rd:#e07a69;--am:#d9a441;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--mu);font:inherit;cursor:pointer}
nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
button{font:inherit}.btn{background:var(--ac);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.sec{background:var(--ac2);color:var(--ac)}.btn.del{background:none;color:var(--rd);padding:4px 8px}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.bar h2{margin:0;font-size:20px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}tr:last-child td{border:0}tbody tr{cursor:pointer}tbody tr:hover{background:var(--ac2)}
.empty{padding:28px;text-align:center;color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kp div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px}
.kp b{display:block;font-size:26px;margin-top:2px}.kp span{color:var(--mu);font-size:13px}
.tag{padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:12px}
.tag.r{background:#b3402f22;color:var(--rd)}.tag.a{background:#a8741a22;color:var(--am)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:min(460px,94vw);padding:18px}
dialog::backdrop{background:#0008}dialog{max-height:92vh;overflow:auto}h3{margin:18px 0 8px;font-size:16px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
#st{font-size:13px;color:var(--mu)}
.note{font-size:13px;color:var(--mu);margin:8px 0 0;line-height:1.4}
</style>
</head>
<body>
<header>
<h1>Agence</h1>
<nav id="nav"></nav>
<span id="st"></span>
<button class="btn sec" id="bSync">Synchronisation</button>
</header>
<main id="main"></main>

<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<dialog id="dV" style="width:min(800px,96vw)"><div id="vb"></div><div class="row"><a id="vd" class="btn sec" style="text-decoration:none">Télécharger</a><button class="btn" id="vx">Fermer</button></div></dialog>
<dialog id="dSync"><div id="syncBody"></div></dialog>

<script>
const ST=['Disponible','Sous offre','Vendu / loué'];
const E={
biens:{l:'Biens',s:'bien',f:[['titre','Titre','text'],['type','Type','sel',['Appartement','Maison','Local','Terrain']],['trans','Transaction','sel',['Vente','Location']],['prix','Prix (MAD)','number'],['surf','Surface (m²)','number'],['adr','Adresse','text'],['proprio','Propriétaire','ref','clients'],['statut','Statut','sel',ST],['mandat','Mandat','sel',['Aucun','Simple','Exclusif']],['mfin','Fin du mandat','date'],['taux','Commission (%)','number']],c:['titre','trans','prix','mandat','statut'],files:1,lab:r=>r.titre},
clients:{l:'Clients',s:'client',f:[['nom','Nom','text'],['tel','Téléphone','text'],['mail','E-mail','text'],['role','Rôle','sel',['Acquéreur','Locataire','Propriétaire']],['notes','Notes','area']],c:['nom','tel','role'],files:1,lab:r=>r.nom},
visites:{l:'Visites',s:'visite',f:[['date','Date et heure','datetime-local'],['bien','Bien','ref','biens'],['client','Client','ref','clients'],['statut','Statut','sel',['Prévue','Faite','Annulée']],['notes','Notes','area']],c:['date','bien','client','statut'],lab:r=>r.date},
loyers:{l:'Loyers',s:'loyer',f:[['bien','Bien','ref','biens'],['loc','Locataire','ref','clients'],['mois','Mois','month'],['montant','Montant (MAD)','number'],['statut','Statut','sel',['Payé','En attente','Impayé']]],c:['mois','bien','loc','montant','statut'],lab:r=>r.mois}
};
let D=JSON.parse(localStorage.getItem('agence_data')||'null')||{biens:[],clients:[],visites:[],loyers:[]};
let C=JSON.parse(localStorage.getItem('agence_cfg')||'{}');
let tab='dash',timer;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=n=>n===''||n==null?'':Number(n).toLocaleString('fr-FR');
function save(){localStorage.setItem('agence_data',JSON.stringify(D));if(C.token&&C.repo){clearTimeout(timer);status('Modifié…');timer=setTimeout(push,2500)}}
function status(t){$('#st').textContent=t}
function show(k,e,v){const f=e.f.find(x=>x[0]===k);if(f[2]==='ref'){const r=D[f[3]].find(x=>x.id===v);return r?esc(E[f[3]].lab(r)):''}
if(k==='statut'||k==='role'){const c=['Impayé','Annulée'].includes(v)?'r':['En attente','Sous offre'].includes(v)?'a':'';return`<span class="tag ${c}">${esc(v)}</span>`}
if(k==='prix'||k==='montant')return fmt(v);if(k==='date'&&v)return esc(v.replace('T',' '));return esc(v)}
function nav(){$('#nav').innerHTML=[['dash','Tableau de bord'],...Object.entries(E).map(([k,e])=>[k,e.l])].map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}
function render(){nav();const m=$('#main');if(tab==='dash'){dash(m);return}
const e=E[tab],rows=D[tab];
m.innerHTML=`<div class="bar"><h2>${e.l}</h2><button class="btn" id="add">Ajouter un ${e.s}</button></div><div class="tw">${rows.length?`<table><thead><tr>${e.c.map(k=>`<th>${e.f.find(f=>f[0]===k)[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr data-id="${r.id}">${e.c.map(k=>`<td>${show(k,e,r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`:`<div class="empty">Aucun ${e.s} pour l'instant. Ajoutez le premier.</div>`}</div>`;
$('#add').onclick=()=>edit()}
function dashOld(m){const dispo=D.biens.filter(b=>b.statut==='Disponible').length,imp=D.loyers.filter(l=>l.statut==='Impayé').reduce((s,l)=>s+Number(l.montant||0),0),now=new Date().toISOString().slice(0,16),next=D.visites.filter(v=>v.statut==='Prévue'&&v.date>=now).sort((a,b)=>a.date<b.date?-1:1).slice(0,5);
m.innerHTML=`<div class="kp"><div><span>Biens disponibles</span><b>${dispo}</b></div><div><span>Clients</span><b>${D.clients.length}</b></div><div><span>Visites à venir</span><b>${next.length}</b></div><div><span>Loyers impayés (MAD)</span><b>${fmt(imp)}</b></div></div><div class="bar"><h2>Prochaines visites</h2></div><div class="tw">${next.length?`<table><tbody>${next.map(v=>`<tr><td>${esc(v.date.replace('T',' '))}</td><td>${show('bien',E.visites,v.bien)}</td><td>${show('client',E.visites,v.client)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucune visite prévue.</div>'}</div>`}
function edit(id){const e=E[tab],r=id?D[tab].find(x=>x.id===id):{};
$('#frm').innerHTML=`<h2 style="margin:0">${id?'Modifier':'Nouveau'} ${e.s}</h2>`+e.f.map(([k,l,t,o])=>{const v=esc(r[k]??'');let i;
if(t==='sel')i=`<select name="${k}">${o.map(x=>`<option ${r[k]===x?'selected':''}>${x}</option>`).join('')}</select>`;
else if(t==='ref')i=`<select name="${k}"><option value="">—</option>${D[o].map(x=>`<option value="${x.id}" ${r[k]===x.id?'selected':''}>${esc(E[o].lab(x))}</option>`).join('')}</select>`;
else if(t==='area')i=`<textarea name="${k}" rows="3">${v}</textarea>`;
else i=`<input name="${k}" type="${t}" value="${v}">`;return`<label>${l}</label>${i}`}).join('')+(e.files&&id?`<label>Fichiers (photos, vidéos, documents)</label><div id="fl"></div><input type="file" id="fup" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" style="margin-top:8px">`:e.files?`<p class="note">Enregistrez d'abord la fiche, puis rouvrez-la pour ajouter des fichiers.</p>`:'')+`<div class="row">${id?'<button type="button" class="btn del" id="del">Supprimer</button>':''}<button type="button" class="btn sec" id="cx">Annuler</button><button class="btn" value="ok">Enregistrer</button></div>`;
$('#dlg').showModal();if(e.files&&id){renderFiles(r);$('#fup').onchange=async ev=>{for(const f of ev.target.files)await upFile(r,f);ev.target.value='';renderFiles(r)}}$('#cx').onclick=()=>$('#dlg').close();
if(id)$('#del').onclick=()=>{if(confirm('Supprimer cet élément ?')){D[tab]=D[tab].filter(x=>x.id!==id);save();$('#dlg').close();render()}};
$('#frm').onsubmit=ev=>{const fd=new FormData($('#frm'));const o=id?r:{id:uid()};e.f.forEach(([k])=>o[k]=fd.get(k));if(!id)D[tab].push(o);save();render()}}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-t]');if(t){tab=t.dataset.t;render();return}
const tr=ev.target.closest('tbody tr[data-id]');if(tr)edit(tr.dataset.id)});

/* ---- Tableau de bord ---- */
function dash(m){const td=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString(),day=td.slice(0,10),now=td.slice(0,16);
const com=b=>Number(b.prix||0)*Number(b.taux||0)/100,fin=b=>b.statut==='Vendu / loué';
const vue=D.biens.filter(b=>!fin(b)).reduce((s,b)=>s+com(b),0),done=D.biens.filter(fin).reduce((s,b)=>s+com(b),0);
const imp=D.loyers.filter(l=>l.statut==='Impayé').reduce((s,l)=>s+Number(l.montant||0),0);
const lim=new Date(Date.now()+30*864e5).toISOString().slice(0,10);
const man=D.biens.filter(b=>b.mandat&&b.mandat!=='Aucun'&&b.mfin&&b.mfin<=lim&&!fin(b)).sort((a,b)=>a.mfin<b.mfin?-1:1);
const vs=D.visites.filter(v=>v.statut==='Prévue').sort((a,b)=>a.date<b.date?-1:1);
const today=vs.filter(v=>(v.date||'').startsWith(day)),next=vs.filter(v=>v.date>day+'T99').slice(0,5);
const vt=a=>a.length?`<div class="tw"><table><tbody>${a.map(v=>`<tr><td>${esc((v.date||'').replace('T',' '))}</td><td>${show('bien',E.visites,v.bien)}</td><td>${show('client',E.visites,v.client)}</td></tr>`).join('')}</tbody></table></div>`:'';
m.innerHTML=`<div class="kp"><div><span>Biens disponibles</span><b>${D.biens.filter(b=>b.statut==='Disponible').length}</b></div><div><span>Clients</span><b>${D.clients.length}</b></div><div><span>Commissions en vue (MAD)</span><b>${fmt(Math.round(vue))}</b></div><div><span>Commissions conclues (MAD)</span><b>${fmt(Math.round(done))}</b></div><div><span>Loyers impayés (MAD)</span><b>${fmt(imp)}</b></div></div>
<h3>Visites d'aujourd'hui</h3>${vt(today)||'<div class="tw"><div class="empty">Aucune visite aujourd\'hui.</div></div>'}
<h3>Visites à venir</h3>${vt(next)||'<div class="tw"><div class="empty">Aucune visite à venir.</div></div>'}
<h3>Mandats à renouveler (30 jours)</h3>${man.length?`<div class="tw"><table><tbody>${man.map(b=>`<tr><td>${esc(b.titre)}</td><td>${esc(b.mandat)}</td><td>${esc(b.mfin)} ${b.mfin<day?'<span class="tag r">Expiré</span>':'<span class="tag a">Bientôt</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="tw"><div class="empty">Aucun mandat à renouveler.</div></div>'}`}

/* ---- Fichiers (stockés dans le dépôt de données) ---- */
const api2=p=>`https://api.github.com/repos/${C.repo}/contents/${p}`;
const ghGet=(p,raw)=>fetch(api2(p),{headers:raw?{...hd(),Accept:'application/vnd.github.raw'}:hd()});
const toB64=buf=>{let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)};
const shrink=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>res(b||f),'image/jpeg',.8)};i.onerror=()=>res(f);i.src=URL.createObjectURL(f)});
async function upFile(r,f){if(!C.token||!C.repo){alert('Configurez d\'abord la Synchronisation.');return}
let b=f;if(f.type.startsWith('image/'))b=await shrink(f);
if(b.size>25e6){alert('Fichier trop lourd (max 25 Mo) : '+f.name+'. Compressez la vidéo ou gardez un lien dans les notes.');return}
const nm=f.name.replace(/[^\w.\-]+/g,'_'),p=`fichiers/${r.id}/${Date.now()}-${nm}`;status('Envoi de '+f.name+'…');
try{const res=await fetch(api2(p),{method:'PUT',headers:hd(),body:JSON.stringify({message:'Fichier '+nm,content:toB64(await b.arrayBuffer())})});
if(!res.ok){status('Erreur fichier : '+res.status);return}
(r.files=r.files||[]).push({n:f.name,p,t:b.type||f.type||''});save();status('Fichier ajouté')}catch(e){status('Erreur : '+e.message)}}
async function delFile(r,f){try{const m=await ghGet(f.p);if(m.ok){const j=await m.json();await fetch(api2(f.p),{method:'DELETE',headers:hd(),body:JSON.stringify({message:'Suppression',sha:j.sha})})}r.files=r.files.filter(x=>x!==f);save()}catch(e){status('Erreur : '+e.message)}}
async function openF(f){status('Chargement…');const r=await ghGet(f.p,1);if(!r.ok){status('Erreur '+r.status);return}
const t=f.t||'',u=URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:t||'application/octet-stream'}));status('');
$('#vb').innerHTML=t.startsWith('image/')?`<img src="${u}" style="max-width:100%">`:t.startsWith('video/')?`<video src="${u}" controls playsinline style="max-width:100%"></video>`:t==='application/pdf'?`<iframe src="${u}" style="width:100%;height:60vh;border:0"></iframe>`:`<p>${esc(f.n)}</p>`;
$('#vd').href=u;$('#vd').download=f.n;$('#dV').showModal()}
function renderFiles(r){const el=$('#fl'),fs=r.files||[];
el.innerHTML=fs.length?fs.map((f,i)=>`<div style="display:flex;gap:6px;align-items:center;margin:4px 0"><button type="button" class="btn sec" style="flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis" data-o="${i}">${(f.t||'').startsWith('image/')?'🖼':(f.t||'').startsWith('video/')?'🎬':'📄'} ${esc(f.n)}</button><button type="button" class="btn del" data-x="${i}">✕</button></div>`).join(''):'<p class="note">Aucun fichier.</p>';
el.onclick=async ev=>{const o=ev.target.closest('[data-o]'),x=ev.target.closest('[data-x]');if(o)openF(fs[o.dataset.o]);if(x&&confirm('Supprimer ce fichier ?')){await delFile(r,fs[x.dataset.x]);renderFiles(r)}}}
$('#vx').onclick=()=>$('#dV').close();

/* ---- GitHub ---- */
const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const api=()=>`https://api.github.com/repos/${C.repo}/contents/${C.path||'data.json'}`;
const hd=()=>({Authorization:'Bearer '+C.token,Accept:'application/vnd.github+json'});
async function getRemote(){const r=await fetch(api(),{headers:hd()});if(r.status===404)return null;if(!r.ok)throw new Error('GitHub '+r.status);return r.json()}
async function push(){try{status('Envoi…');const rm=await getRemote();const body={message:'Mise à jour '+new Date().toISOString(),content:b64(JSON.stringify(D,null,1))};if(rm)body.sha=rm.sha;
const r=await fetch(api(),{method:'PUT',headers:hd(),body:JSON.stringify(body)});if(!r.ok)throw new Error('GitHub '+r.status);status('Synchronisé '+new Date().toLocaleTimeString('fr-FR'))}catch(e){status('Erreur : '+e.message)}}
async function pull(){try{status('Récupération…');const rm=await getRemote();if(!rm){status('Aucun fichier distant');return}D=JSON.parse(unb64(rm.content));localStorage.setItem('agence_data',JSON.stringify(D));render();status('Données récupérées')}catch(e){status('Erreur : '+e.message)}}
$('#bSync').onclick=()=>{$('#syncBody').innerHTML=`<h2 style="margin:0">Synchronisation GitHub</h2>
<label>Dépôt (utilisateur/nom)</label><input id="sr" value="${esc(C.repo||'')}" placeholder="monnom/agence-donnees">
<label>Fichier</label><input id="sp" value="${esc(C.path||'data.json')}">
<label>Jeton d'accès personnel</label><input id="sk" type="password" value="${esc(C.token||'')}">
<p class="note">Utilisez un dépôt <b>privé</b> et un jeton fin (fine-grained) limité à ce dépôt, avec la permission « Contents : lecture et écriture ». Le jeton reste dans ce navigateur uniquement.</p>
<div class="row" style="flex-wrap:wrap"><button class="btn sec" id="ex">Exporter JSON</button><button class="btn sec" id="im">Importer JSON</button><button class="btn sec" id="pl">Récupérer</button><button class="btn" id="ps">Enregistrer et envoyer</button></div><input type="file" id="fi" accept=".json" hidden>`;
$('#dSync').showModal();
const cfg=()=>{C={repo:$('#sr').value.trim(),path:$('#sp').value.trim()||'data.json',token:$('#sk').value.trim()};localStorage.setItem('agence_cfg',JSON.stringify(C))};
$('#ps').onclick=()=>{cfg();$('#dSync').close();push()};$('#pl').onclick=()=>{cfg();$('#dSync').close();pull()};
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='agence-sauvegarde.json';a.click()};
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=async ev=>{try{D=JSON.parse(await ev.target.files[0].text());save();render();$('#dSync').close()}catch(e){alert('Fichier invalide')}}};
$('#dSync').addEventListener('click',ev=>{if(ev.target.id==='dSync')ev.target.close()});
render();
</script>
</body>
</html>
